<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Articulate Rise Reflection Email Add-in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    #rise-reflection-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 16px;
      border: 1px solid #e3e3e3;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      font-family: sans-serif;
      background: #fff;
    }
    #rise-reflection-container h3 {
      margin-bottom: 12px;
    }
    #rise-reflection-container textarea,
    #rise-reflection-container input[type="email"] {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 16px;
      box-sizing: border-box;
    }
    #rise-reflection-container textarea {
      resize: vertical;
      margin-bottom: 12px;
    }
    #rise-reflection-container input[type="email"] {
      margin-bottom: 12px;
    }
    #send-reflection-btn {
      width: 100%;
      padding: 12px;
      background: #2c7be5;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #send-reflection-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #reflection-message {
      margin-top: 16px;
      font-size: 15px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div id="rise-reflection-container">
    <h3>Reflection</h3>
    <textarea id="reflection-text" placeholder="Write your reflection here..." rows="6"></textarea>
    <input type="email" id="user-email" placeholder="Your email address" />
    <button id="send-reflection-btn">Send Reflection to Email</button>
    <div id="reflection-message"></div>
  </div>
  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    (function() {
      // Initialize EmailJS
      emailjs.init('xbrRnblqLJkUZOa-y');

      var btn = document.getElementById("send-reflection-btn");
      var msgDiv = document.getElementById("reflection-message");

      btn.onclick = function() {
        var reflection = document.getElementById("reflection-text").value.trim();
        var email = document.getElementById("user-email").value.trim();
        msgDiv.innerHTML = "";

        // Validate
        if (!reflection) {
          msgDiv.innerHTML = '<span style="color:#e74c3c;">Please enter your reflection.</span>';
          return;
        }
        if (!validateEmail(email)) {
          msgDiv.innerHTML = '<span style="color:#e74c3c;">Please enter a valid email address.</span>';
          return;
        }

        btn.disabled = true;
        msgDiv.innerHTML = "Sending...";

        // Prepare template parameters for EmailJS
        var templateParams = {
          reflection: reflection,
          to_email: email
        };

        emailjs.send('service_nyv0e7q', 'template_n8xvr3h', templateParams)
        .then(function(response) {
          msgDiv.innerHTML = '<span style="color:green;">Reflection sent! Please check your inbox.</span>';
          document.getElementById("reflection-text").value = "";
          document.getElementById("user-email").value = "";
          btn.disabled = false;
        }, function(error) {
          msgDiv.innerHTML = '<span style="color:#e74c3c;">Error sending email. Please try again later.</span>';
          btn.disabled = false;
        });
      };

      function validateEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }
    })();
  </script>
</body>
</html>
